<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contact</title>
  </head>
  <body>
    <video id="video" width="500" controls autoplay loop>
      <source src="./music/Ariana Grande - bye [Altare Remix] - Extended Remix.mp4"
    </video>
    <audio id="audio" src="./music/Ariana Grande - bye [Altare Remix] - Extended Remix.mp3"></audio>
    <script>
        const video = document.getElementById("video");
        const audio = document.getElementById("audio");

        video.addEventListener("play", function () {
            audio.currentime = video.currentime; audio.play();
        });

        video.addEventListener("pause", function () {
audio.pause();
        });

        video.addEventListener("seeking", function () {
audio.currentime = video.currentime;
        });

        video.addEventListener("ended", function () {
audio.pause(); audio.currentime = 0;
        });
    </script>
  </body>
</html>
